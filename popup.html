<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg:            #faf8f5;
      --bg-card:       #fffef9;
      --bg-input:      #faf8f3;
      --text:          #2c2416;
      --text-secondary:#6b5e4a;
      --text-muted:    #a09880;
      --accent:        #ff2442;
      --accent-hover:  #d91e38;
      --accent-soft:   #fff0f3;
      --accent-glow:   rgba(255,36,66,0.12);
      --border:        #e4dbce;
      --border-light:  #f0e8d8;
      --shadow-sm:     0 1px 2px rgba(44,36,22,0.04);
      --shadow-md:     0 1px 3px rgba(44,36,22,0.06), 0 6px 20px rgba(44,36,22,0.04);
      --shadow-lg:     0 2px 8px rgba(44,36,22,0.06), 0 12px 32px rgba(44,36,22,0.05);
      --radius-sm:     8px;
      --radius-md:     12px;
      --radius-lg:     16px;
      --font-serif:    "STSong", "Songti SC", "Noto Serif SC", "SimSun", "KaiTi", serif;
      --font-sans:     "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      --success:       #5b8c5a;
      --warning:       #d4843a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 440px;
      min-height: 200px;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      padding: 0;
      position: relative;
      overflow: hidden;
    }

    /* ── Grain texture overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    }

    /* ── Decorative top accent ── */
    body::after {
      content: '';
      position: absolute; top: 0; left: 16px; right: 16px; height: 2px; z-index: 1;
      background: linear-gradient(90deg, transparent, var(--accent) 20%, var(--accent) 80%, transparent);
      border-radius: 0 0 1px 1px;
      opacity: 0.6;
    }

    /* ── Main container ── */
    .container {
      position: relative; z-index: 1;
      padding: 16px 18px 18px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header .left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, #ff2442 0%, #ff5a75 100%);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 14px; font-weight: 700;
      font-family: var(--font-serif);
      box-shadow: 0 2px 8px rgba(255,36,66,0.25);
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      font-family: var(--font-serif);
      letter-spacing: 0.02em;
    }
    .header h1 span {
      color: var(--text-secondary);
      font-weight: 400;
      font-size: 11px;
      font-family: var(--font-sans);
      margin-left: 2px;
    }
    .settings-link {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
      background: transparent;
      transition: background 0.2s;
    }
    .settings-link:hover {
      background: var(--accent-soft);
    }

    /* ── Status indicator ── */
    .status-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px; min-height: 20px;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: var(--text-muted);
      transition: background 0.3s;
    }
    .status-dot.success { background: var(--success); box-shadow: 0 0 6px rgba(91,140,90,0.4); }
    .status-dot.error   { background: var(--accent); box-shadow: 0 0 6px rgba(255,36,66,0.4); }
    .status-dot.loading { background: var(--warning); box-shadow: 0 0 6px rgba(212,132,58,0.4); animation: pulse-dot 1.2s ease-in-out infinite; }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.6); opacity: 0.5; }
    }
    #status {
      font-size: 11px; color: var(--text-secondary); line-height: 1;
      transition: color 0.3s;
    }

    /* ── Source toggle ── */
    .source-toggle {
      font-size: 11px;
      color: var(--accent);
      cursor: pointer;
      margin-bottom: 8px;
      user-select: none;
      font-weight: 500;
      display: inline-flex; align-items: center; gap: 4px;
      transition: color 0.15s;
    }
    .source-toggle:hover { color: var(--accent-hover); }
    .source-toggle .arrow {
      display: inline-block; transition: transform 0.25s;
      font-size: 9px;
    }
    .source-card.show ~ .source-toggle .arrow,
    .source-card.show + .source-toggle .arrow { display: none; }

    .source-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 12px;
      max-height: 130px;
      overflow-y: auto;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
      box-shadow: var(--shadow-sm);
    }
    .source-card.show { display: block; animation: fadeSlideIn 0.25s ease-out; }

    /* ── Input section ── */
    .input-section {
      margin-bottom: 10px;
    }
    .input-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .custom-input {
      width: 100%;
      min-height: 52px;
      max-height: 80px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: var(--font-sans);
      line-height: 1.55;
      resize: vertical;
      background: var(--bg-input);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .custom-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .custom-input::placeholder { color: var(--text-muted); }

    /* ── Controls row ── */
    .controls-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; gap: 10px;
    }
    .quick-types {
      display: flex; gap: 5px; flex-wrap: wrap;
    }
    .quick-types button {
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg-card);
      font-size: 10.5px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.18s;
      white-space: nowrap;
      font-weight: 500;
    }
    .quick-types button:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 1px 4px var(--accent-glow);
    }

    .count-box {
      display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    }
    .count-box label {
      font-size: 11px; color: var(--text-muted); white-space: nowrap;
    }
    .count-box input {
      width: 38px;
      padding: 5px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      font-family: var(--font-sans);
      background: var(--bg-card);
      color: var(--text);
      font-weight: 500;
    }
    .count-box input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    /* ── Result card ── */
    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
      max-height: 340px;
      overflow-y: auto;
      font-size: 13px;
      color: var(--text);
      line-height: 1.7;
      display: none;
      box-shadow: var(--shadow-md);
    }
    .result-card.show {
      display: block;
      animation: fadeSlideIn 0.3s ease-out;
    }
    .result-card::-webkit-scrollbar,
    .source-card::-webkit-scrollbar {
      width: 4px;
    }
    .result-card::-webkit-scrollbar-track,
    .source-card::-webkit-scrollbar-track {
      background: transparent;
    }
    .result-card::-webkit-scrollbar-thumb,
    .source-card::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    /* Loading shimmer */
    .loading-dots {
      color: var(--text-muted);
      text-align: center;
      padding: 24px;
      font-size: 13px;
      font-family: var(--font-serif);
      letter-spacing: 0.03em;
    }
    .loading-dots::after {
      content: '...';
      animation: ellipsis 1.5s steps(4, end) infinite;
    }
    @keyframes ellipsis {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }

    /* ── Version tabs ── */
    .tab-bar {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-light);
    }
    .tab-btn {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: transparent;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-sans);
      font-weight: 500;
      transition: all 0.2s;
      white-space: nowrap;
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(255,36,66,0.25);
    }
    .tab-content {
      display: none;
      white-space: pre-wrap;
      animation: fadeSlideIn 0.25s ease-out;
    }
    .tab-content.active { display: block; }

    /* ── Actions ── */
    .actions { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 11px 0;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }

    .btn-gen {
      background: var(--accent);
      color: #fff;
      flex: 3;
      letter-spacing: 0.02em;
      box-shadow: 0 2px 8px rgba(255,36,66,0.2);
    }
    .btn-gen:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 4px 14px rgba(255,36,66,0.3);
    }
    .btn-gen.generating {
      background: var(--warning);
      box-shadow: 0 2px 8px rgba(212,132,58,0.2);
    }

    .btn-copy {
      background: var(--bg-card);
      color: var(--text-secondary);
      flex: 1;
      border: 1px solid var(--border);
      font-weight: 500;
    }
    .btn-copy:hover:not(:disabled) {
      background: var(--bg);
      border-color: var(--text-muted);
      color: var(--text);
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: var(--text);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 99;
      box-shadow: var(--shadow-lg);
      font-family: var(--font-sans);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Animations ── */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="left">
        <div class="logo">小</div>
        <h1>小红书<span>· AI 文案生成器</span></h1>
      </div>
      <a class="settings-link" id="btnSettings" title="API 设置">⚙️</a>
    </div>

    <!-- Status -->
    <div class="status-row">
      <div class="status-dot" id="statusDot"></div>
      <div id="status">🔍 正在读取笔记...</div>
    </div>

    <!-- Source toggle + card -->
    <div>
      <div class="source-toggle" id="sourceToggle">
        📝 查看笔记原文 <span class="arrow">▾</span>
      </div>
    </div>
    <div class="source-card" id="sourceCard"></div>

    <!-- Custom prompt input -->
    <div class="input-section">
      <div class="input-label">💬 告诉 AI 怎么生成</div>
      <textarea class="custom-input" id="customPrompt"
        placeholder="例如：写一篇小红书种草文案，用幽默风格，突出性价比"></textarea>
    </div>

    <!-- Quick types + count -->
    <div class="controls-row">
      <div class="quick-types" id="quickTypes">
        <button data-fill="写一篇小红书文案，口语化种草风格，加 emoji 和话题标签">📕 小红书</button>
        <button data-fill="写一段朋友圈文案，短小精悍，有情感温度">💬 朋友圈</button>
        <button data-fill="写一个短视频脚本，带画面描述和配音，开头要有钩子">🎬 短视频</button>
        <button data-fill="写一篇公众号文章，结构清晰，有深度">📰 公众号</button>
      </div>
      <div class="count-box">
        <label for="genCount">生成</label>
        <input type="number" id="genCount" value="1" min="1" max="10">
        <label for="genCount">篇</label>
      </div>
    </div>

    <!-- Result -->
    <div class="result-card" id="resultCard">
      <div class="loading-dots" id="loadingDots">创作中</div>
      <div id="resultText"></div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn-gen" id="btnGenerate" disabled>🤖 AI 生成文案</button>
      <button class="btn-copy" id="btnCopy" disabled>📋 复制</button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">✅ 已复制</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
